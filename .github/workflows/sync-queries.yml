name: Verify Python Query Sync

on:
  push:
  pull_request:
    branches:
      - main
      - master
      - workflow_and_bindings
  workflow_dispatch:
  

permissions:
  contents: read

jobs:
  verify_python_queries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify Python query directories are synchronized
        run: python3 scripts/sync_queries.py --check-python
